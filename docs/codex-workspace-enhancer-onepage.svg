      <stop offset="0" stop-color="#07111e"/><stop offset="0.55" stop-color="#0b1827"/><stop offset="1" stop-color="#07111e"/>
    </linearGradient>
    <linearGradient id="mint" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#b3f8dc"/><stop offset="1" stop-color="#55d9b1"/></linearGradient>
    <linearGradient id="blue" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#89c5ff"/><stop offset="1" stop-color="#567cff"/></linearGradient>
